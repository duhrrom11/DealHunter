<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealHunter - Automatisierter eBay Glitch & Schatz-Finder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1d20;
            color: #f4f4f2;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #23272a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            color: #c5a059;
            margin-bottom: 10px;
        }
        p {
            color: #b0b3b8;
            font-size: 1.1em;
        }
        .badge {
            display: inline-block;
            background: #2c4c3e;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DealHunter</h1>
        <p>Der vollautomatische eBay-Scraper für Preisfehler, Tippfehler-Glitches und versteckte Schätze.</p>
        <div class="badge">Status: Live & Verbunden mit GitHub Cloud</div>
    </div>
</body>
</html>
